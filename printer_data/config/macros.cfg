#####################################################################
# 	Macros
#####################################################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR

    G28

    # strech the filment:
    G1 X0 Y0 F1500

    # # Clean Nozzle
    
    # M109 S250 ; Heat up the nozzel
    # G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    # G1 X100 Y20 Z0.2 F5000.0 ; Move to start position
    # G1 X250 Y20 Z0.0 F1500.0 ; Draw the first line
    # G1 X250 Y19.5 Z0.0 F5000.0 ; Move a side a little
    # G1 X100 Y19.5 Z-0.2 F1500.0 ; Draw the second line
 
    STATUS_LEVELING
    Z_TILT_ADJUST retries=1


[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set Purge_Line_EXTRUDER_TEMP = 220 %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(70)|float %}
    {% set INITIAL_EXTRUDER = params.INITIAL_EXTRUDER|default(0)|int %}

    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber TARGET={CHAMBER_TEMP}
    SET_PIN PIN=caselight VALUE=0
    SKEW_PROFILE LOAD=Califlower

    # {% if CHAMBER_TEMP == 0 %}
    #   {% set CHAMBER_TEMP = 70 %}
    # {% endif %}


# Start heating bed & nozzel for Z homming and leveling (G32)
    STATUS_HEATING

    M104 S200 T0
    M140 S{BED_TEMP}
    
    G32                            ; homming and leveling all axes
    G1 Z20 F3000                   ; move nozzle away from bed
    # G4 P6000                       ; pause for 6 seconds

    M190 S{BED_TEMP}
 
    G28 Z

# Draw purge line:

    M109 S{Purge_Line_EXTRUDER_TEMP} T0
    M109 S{Purge_Line_EXTRUDER_TEMP} T1

#  with tool 1:

    G1 X80 Y20.6 Z4 F5000.0 ; Move to purg position
    G92 E0
    G1 E30 F1500
    G92 E0
    G1 X100 Y20.6 Z0.5 F5000.0 ; Move to start position
    G1 X200 Y20.6 Z0.5 F1500.0 E20 ; Draw the first line
    G1 X200 Y20 Z0.5 F5000.0 ; Move a side a little
    G1 X100 Y20 Z0.5 F1500.0 E40 ; Draw the second line
    G92 E0 ; Reset Extruder
    G1 Z5 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X100 Y25 Z0.4 F5000.0 ; Move over to prevent blob squish

# Draw purge line with tool 1:
    T1

    G1 X80 Y25.6 Z4 F5000.0 ; Move to purg position
    G92 E0
    G1 E30 F1500
    G92 E0
    G1 X100 Y25.6 Z0.5 F5000.0 ; Move to start position
    G1 X200 Y25.6 Z0.5 F1500.0 E20 ; Draw the first line
    G1 X200 Y25 Z0.5 F5000.0 ; Move a side a little
    G1 X100 Y25 Z0.5 F1500.0 E40 ; Draw the second line
    G92 E0 ; Reset Extruder
    G1 Z5 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X100 Y30 Z0.4 F5000.0 ; Move over to prevent blob squish

# Adaptive Bad Scanning 
    T0
    BED_MESH_CALIBRATE ADAPTIVE=1


# Switching to Print Initial Tool:
    {% if INITIAL_EXTRUDER == 1 %}
        M118 Using extruder: 1
        M104 S0 T0
        T1
        M109 S{EXTRUDER_TEMP} T1

        # Configure Input Shaper
        SET_INPUT_SHAPER shaper_type_x=mzv shaper_freq_x=45.8
        SET_INPUT_SHAPER shaper_type_y=2hump_ei shaper_freq_y=94.4

    {% else %}
        M118 Using extruder: 0
        M104 S0 T1
        T0
        M109 S{EXTRUDER_TEMP} T0

        # Configure Input Shaper
        SET_INPUT_SHAPER shaper_type_x=3hump_ei shaper_freq_x=83.8
        SET_INPUT_SHAPER shaper_type_y=3hump_ei shaper_freq_y=90.6
        
    {% endif %}
    
    STATUS_PRINTING


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    T0
    SET_PIN PIN=caselight VALUE=0.1
    TURN_OFF_HEATERS
    
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing

    G92 E0                         ; zero the extruder
    G0 E-1 F1800 	               ; extract filament
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G28 X Y                        ; park nozzles at rear
    G1 Z150 F3600                  ; move bed down
    G4 P5000                       ; wait for 5 seconds
    G0 E-45 F1800                  ; extract filament to cold end 
    M84                            ; Disable steppers
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1

    # Start fans
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber [TARGET=30]
    SET_FAN_SPEED FAN=fan2 SPEED=1
      
    # Turn off  fans in 10 Min
    UPDATE_DELAYED_GCODE ID=Fans_off DURATION=600
    
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    #RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

    STATUS_READY


[gcode_macro PRINT_CANCEL]
gcode:
    G91
    # Raise nozzle and retract
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle from print
    
    # Retract Filament
    # G4 P5000        ; wait for 5 seconds
    G0 E-2 F1800   ; extract filament to cold end #G1 E-50 F1600

    T0

    TURN_OFF_HEATERS
    
    # move head back and bad down
    G90                          ; absolute positioning
    G1 Z150 F3600
    G28 X Y                      ; park nozzles at rear

    G4 P5000        ; wait for 5 seconds
    G0 E-43 F1800   ; extract filament to cold end  

    BED_MESH_CLEAR
    SET_SKEW CLEAR=1

    # Start fans
    M118 Starting fans..

    SET_FAN_SPEED FAN=fan2 SPEED=1
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Chamber [TARGET=30]
    
    # Disable steppers
    M84

    # Turn off  fans in 10 Min
    UPDATE_DELAYED_GCODE ID=Fans_off DURATION=600


[gcode_arcs]
#resolution: 1.0
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[gcode_macro Printer_Wormup]
gcode:
    M140 S120
    G4 P300000
    M140 S0

[gcode_macro Update_Git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True